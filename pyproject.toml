[project]
name = "spr12ian-github-io"
version = "0.1.0"
description = "Python helpers for the spr12ian.github.io site."
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "google-auth",
    "gspread",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39",
    "pytest",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.basedpyright]
include = ["export_comments.py"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
